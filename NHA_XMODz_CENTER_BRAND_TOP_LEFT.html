<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NHA XMODz</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050008;font-family:Arial,sans-serif}
.stage{position:relative;width:min(100%,760px);margin:0 auto;line-height:0}
.art{display:block;width:100%;height:auto}
.key-panel{
 position:absolute;left:50%;top:61%;transform:translate(-50%,-50%);
 width:min(76%,440px);padding:13px;border:1px solid rgba(214,110,255,.9);
 border-radius:14px;background:rgba(8,0,18,.72);
 box-shadow:0 0 18px rgba(174,0,255,.7),inset 0 0 14px rgba(174,0,255,.18);
 backdrop-filter:blur(5px);line-height:normal;text-align:center
}
.key-panel input{
 width:100%;height:45px;padding:0 12px;border-radius:8px;
 border:1px solid #b82cff;background:rgba(0,0,0,.82);color:#fff;
 font-size:15px;text-align:center;outline:none
}
.key-panel input::placeholder{color:#d6b4eb}\n.key-panel input:focus{border-color:#00f0ff;box-shadow:0 0 12px rgba(0,240,255,.75),inset 0 0 8px rgba(0,240,255,.15)}
.key-panel button{
 width:100%;height:43px;margin-top:9px;border:0;border-radius:8px;
 background:linear-gradient(100deg,#00cfff,#8a00e8,#f000d8);background-size:220% 100%;\n  box-shadow:0 0 12px rgba(190,0,255,.7),0 0 22px rgba(0,220,255,.35);\n  color:white;
 font-size:15px;font-weight:800;letter-spacing:2px;cursor:pointer
}
#status{display:block;min-height:17px;margin-top:9px;color:#fff;font-size:12px;font-weight:800;letter-spacing:1.5px;text-shadow:0 0 8px currentColor}\n.key-panel button:hover{filter:brightness(1.2);transform:translateY(-1px);box-shadow:0 0 16px rgba(0,220,255,.8),0 0 28px rgba(190,0,255,.85)}\n@keyframes keyGlow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

#memberPanel{
 display:none;position:absolute;left:50%;top:61%;transform:translate(-50%,-50%);
 width:min(82%,460px);padding:17px 15px;border:1px solid #00eaff;border-radius:16px;
 background:rgba(5,0,20,.91);box-shadow:0 0 16px rgba(0,234,255,.8),0 0 34px rgba(177,0,255,.55);
 color:#fff;text-align:center;line-height:normal;backdrop-filter:blur(7px)
}
#memberPanel h2{margin:0 0 12px;color:#8dfcff;font-size:20px;letter-spacing:2px;text-shadow:0 0 12px #00dfff}
#expiryLabel{font-size:13px;color:#d8c9ff;margin:5px 0}

#expiryTime .time-days{
 color:#ff304f;
 text-shadow:0 0 8px rgba(255,35,75,.95),0 0 18px rgba(255,35,75,.7);
}
#expiryTime .time-hours{
 color:#ff8a24;
 text-shadow:0 0 8px rgba(255,138,36,.95),0 0 18px rgba(255,100,20,.65);
}
#expiryTime .time-minutes{
 color:#ff3bd4;
 text-shadow:0 0 8px rgba(255,59,212,.95),0 0 18px rgba(255,59,212,.7);
}
#expiryTime .time-seconds{
 color:#ffe34d;
 text-shadow:0 0 8px rgba(255,227,77,.95),0 0 18px rgba(255,190,30,.7);
}

#expiryTime{font-size:22px;font-weight:900;letter-spacing:1px;color:#7dffcb;text-shadow:0 0 12px #00ffad;margin:8px 0 13px}
#memberKey{font-size:11px;color:#c7b5e8;margin:0 0 12px;word-break:break-all}
#openGame{
 width:100%;height:46px;border:0;border-radius:10px;margin-top:5px;
 color:#061018;font-size:15px;font-weight:900;letter-spacing:1.5px;cursor:pointer;
 background:linear-gradient(100deg,#00f0ff,#76ffb5);box-shadow:0 0 16px rgba(0,240,255,.7)
}
#logoutBtn{width:100%;height:36px;margin-top:9px;border:1px solid #bd70ff;border-radius:9px;background:transparent;color:#e8caff;font-weight:700}
@media(max-width:420px){#memberPanel{top:61%;padding:13px 11px}#memberPanel h2{font-size:18px}#expiryTime{font-size:19px}}

@media(max-width:420px){
 .key-panel{top:61%;width:82%;padding:10px;border-radius:12px}
 .key-panel input{height:39px;font-size:13px}
 .key-panel button{height:38px;font-size:13px}
}

.brand-mark{
 position:absolute;left:4.2%;top:3.2%;z-index:5;line-height:1;
 padding:8px 12px;border:1px solid rgba(0,238,255,.9);border-radius:9px;
 background:rgba(4,0,18,.62);color:#fff;font-size:clamp(12px,2.7vw,20px);
 font-weight:1000;letter-spacing:1.7px;font-style:italic;
 text-shadow:0 0 6px #00eaff,0 0 13px #00aaff,0 0 22px #a000ff;
 box-shadow:0 0 10px rgba(0,234,255,.65),inset 0 0 9px rgba(150,0,255,.25);
 backdrop-filter:blur(4px);pointer-events:none;white-space:nowrap
}
.brand-mark span{color:#00f0ff}
@media(max-width:420px){
 .brand-mark{left:3.5%;top:2.5%;padding:6px 8px;font-size:12px;letter-spacing:1.1px}
}

</style>
</head>

 <div class="brand-mark"><span>NHA</span> XMODz</div>
 <form class="key-panel" id="loginForm">
  <input id="licenseKey" type="text" placeholder="ENTER LICENSE KEY" autocomplete="off" required>
  <button type="submit">LOGIN</button>
  <span id="status" aria-live="polite"></span>
 </form>
 <section id="memberPanel" aria-live="polite">
  <h2>NHA MEMBER CENTER</h2>
  <div id="memberKey"></div>
  <div id="expiryLabel">KEY EXPIRES IN</div>
  <div id="expiryTime">1D 1H 00M 00S</div>
  <button id="openGame" type="button">OPEN FREE FIRE</button>
  <button id="logoutBtn" type="button">LOG OUT</button>
 </section>
</main>
<script>

const demoKeys = new Set(["NHA-001","NHA-002","NHA-003"]);
const DURATION_MS = (24 + 1) * 60 * 60 * 1000; // 1 day + 1 hour
const form = document.getElementById("loginForm");
const keyInput = document.getElementById("licenseKey");
const statusText = document.getElementById("status");
const memberPanel = document.getElementById("memberPanel");
const expiryTime = document.getElementById("expiryTime");
const memberKey = document.getElementById("memberKey");
let activeTimer = null;
let activeKey = "";

function storageName(key){ return "nha_key_expiry_" + key; }

function formatRemaining(ms){
 const total = Math.max(0, Math.floor(ms / 1000));
 const days = Math.floor(total / 86400);
 const hours = Math.floor((total % 86400) / 3600);
 const minutes = Math.floor((total % 3600) / 60);
 const seconds = total % 60;
 return `<span class="time-days">${days}D</span> <span class="time-hours">${String(hours).padStart(2,"0")}H</span> <span class="time-minutes">${String(minutes).padStart(2,"0")}M</span> <span class="time-seconds">${String(seconds).padStart(2,"0")}S</span>`;
}

function showMember(key, expiresAt){
 form.style.display = "none";
 memberPanel.style.display = "block";
 memberKey.textContent = "LICENSE: " + key;
 if(activeTimer) clearInterval(activeTimer);

 function updateCountdown(){
  const remaining = expiresAt - Date.now();
  if(remaining <= 0){
   clearInterval(activeTimer);
   expiryTime.textContent = "EXPIRED";
   expiryTime.style.color = "#ff739d";
   document.getElementById("openGame").disabled = true;
   document.getElementById("openGame").style.opacity = ".45";
   return;
  }
  expiryTime.innerHTML = formatRemaining(remaining);
  expiryTime.style.color = "#7dffcb";
  document.getElementById("openGame").disabled = false;
  document.getElementById("openGame").style.opacity = "1";
 }
 updateCountdown();
 activeTimer = setInterval(updateCountdown, 1000);
}

form.addEventListener("submit", function(event){
 event.preventDefault();
 const key = keyInput.value.trim().toUpperCase();

 if(!demoKeys.has(key)){
  statusText.textContent = "INVALID LICENSE KEY";
  statusText.style.color = "#ff7caa";
  return;
 }

 let expiresAt = Number(localStorage.getItem(storageName(key)));
 if(!expiresAt){
  expiresAt = Date.now() + DURATION_MS;
  localStorage.setItem(storageName(key), String(expiresAt));
 }
 if(Date.now() >= expiresAt){
  statusText.textContent = "KEY EXPIRED";
  statusText.style.color = "#ff7caa";
  return;
 }

 activeKey = key;
 statusText.textContent = "LOGIN SUCCESS";
 statusText.style.color = "#72ffb2";
 showMember(key, expiresAt);
});

document.getElementById("openGame").addEventListener("click", function(){
 if(!activeKey) return;
 const expiry = Number(localStorage.getItem(storageName(activeKey)) || 0);
 if(Date.now() >= expiry){
  expiryTime.textContent = "EXPIRED";
  return;
 }

 const ua = navigator.userAgent || "";
 const isIOS = /iPad|iPhone|iPod/.test(ua) ||
   (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

 if(isIOS){
  // Try the app's custom URL scheme first. This opens the game only if
  // the installed Free Fire iOS app has registered this scheme.
  const appStoreFallback = "https://apps.apple.com/kh/app/free-fire/id1300146617";
  let leftPage = false;
  const markHidden = () => { if(document.hidden) leftPage = true; };
  document.addEventListener("visibilitychange", markHidden, {once:true});
  window.location.href = "freefire://";
  // If iOS does not hand off to the game, show the official store listing.
  setTimeout(function(){
   if(!leftPage && !document.hidden){
    window.location.href = appStoreFallback;
   }
  }, 1600);
 } else {
  // Launch the installed standard Free Fire Android package directly.
  const intentUrl = "intent://#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package=com.dts.freefireth;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.dts.freefireth;end";
  window.location.href = intentUrl;
 }
});

document.getElementById("logoutBtn").addEventListener("click", function(){
 if(activeTimer) clearInterval(activeTimer);
 activeTimer = null;
 activeKey = "";
 memberPanel.style.display = "none";
 form.style.display = "block";
 keyInput.value = "";
 statusText.textContent = "";
});

</script>
</body>
</html>
